name: Relevé des prix

on:
  schedule:
    # Toutes les 30 minutes (heure UTC). GitHub décale parfois de quelques
    # minutes quand ses runners sont chargés : c'est normal.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Envoyer une alerte même si le seuil n'est pas atteint"
        type: boolean
        default: false
      watch:
        description: "Ne traiter qu'une surveillance (son id)"
        type: string
        default: ""

concurrency:
  group: flight-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Relever les prix
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Secrets absents = chaînes vides : le moteur repart sur watches.yaml.
          WORKER_URL: ${{ secrets.WORKER_URL }}
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          FORCE_NOTIFY: ${{ inputs.force_notify }}
          ONLY_WATCH: ${{ inputs.watch }}
        run: |
          ARGS=""
          [ "$FORCE_NOTIFY" = "true" ] && ARGS="$ARGS --force-notify"
          [ -n "$ONLY_WATCH" ] && ARGS="$ARGS --watch $ONLY_WATCH"
          python -m watcher.cli run $ARGS

      - name: Publier les données pour le dashboard
        run: |
          mkdir -p docs/data
          cp -f data/latest.json docs/data/ 2>/dev/null || true
          cp -f data/history.jsonl docs/data/ 2>/dev/null || true

      - name: Enregistrer l'historique
        run: |
          git config user.name  "flight-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data watches.yaml
          if git diff --staged --quiet; then
            echo "Rien de neuf à committer."
            exit 0
          fi
          git commit -m "Relevé des prix — $(date -u '+%Y-%m-%d %H:%M UTC')"
          # -X theirs : sur conflit, garder les données de CE run. Deux relevés
          # simultanés touchent les mêmes fichiers ; sans ça le rebase s'arrête
          # et laisse des marqueurs de conflit dans data/latest.json.
          # Le rebase avorté après chaque échec garantit un dépôt propre pour
          # les étapes suivantes.
          for i in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin "$GITHUB_REF_NAME" \
               && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push refusé, nouvelle tentative ($i)…"
            sleep $((i * 5))
          done
          git rebase --abort 2>/dev/null || true
          echo "::warning::Impossible de pousser l'historique après 3 tentatives."

      - name: Résumé
        if: always()
        run: python scripts/summary.py

  # Les commits poussés avec GITHUB_TOKEN ne déclenchent aucun autre workflow
  # (garde-fou anti-boucle de GitHub) : on déploie donc le dashboard ici même,
  # sinon il resterait figé sur les données du premier run.
  deploy:
    needs: watch
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # récupère le commit que le job précédent vient de pousser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
